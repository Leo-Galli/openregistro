# Full stack: the app backed by PostgreSQL. See docker-compose.json.yml for a
# database-free alternative using the JSON driver.
#
# Usage:
#   cp apps/web/.env.example .env   # then fill in AUTH_SECRET at minimum
#   docker compose up
#
# First run against a fresh Postgres volume: apply migrations once from the
# host (the runtime image is a minimal standalone build and does not include
# drizzle-kit/tsx), then open http://localhost:3000 and complete the setup
# wizard:
#   DATABASE_URL=postgres://openregistro:openregistro@localhost:5432/openregistro \
#     pnpm --filter @openregistro/db db:migrate

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openregistro
      POSTGRES_PASSWORD: openregistro
      POSTGRES_DB: openregistro
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openregistro']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://openregistro:openregistro@postgres:5432/openregistro
      AUTH_SECRET: '${AUTH_SECRET:?set AUTH_SECRET in .env, e.g. via: openssl rand -base64 32}'
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-OpenRegistro <no-reply@example.com>}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
