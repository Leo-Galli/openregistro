name: Mobile APK

# Builds a sideloadable Android APK.
# - On v* tags: attaches to that GitHub Release
# - On workflow_dispatch: publishes/updates the rolling "apk-latest" prerelease
#   so the marketing site download link stays fresh.
#
# shortcut: debug-signed APK (installable now); Play Store needs EAS + a keystore later.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install mobile dependencies
        run: npm ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/OpenRegistro.apk
          ls -lh dist/OpenRegistro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRegistro-apk
          path: apps/mobile/dist/OpenRegistro.apk

      - name: Attach APK to version release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/OpenRegistro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rolling apk-latest prerelease
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Latest Android APK
          prerelease: true
          body: |
            Sideloadable OpenRegistro Android build (debug-signed).
            Pick your school in the app, then sign in - your role is detected automatically.
          files: apps/mobile/dist/OpenRegistro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
