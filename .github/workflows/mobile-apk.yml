name: Mobile APK

# Builds a sideloadable Android APK and attaches it to GitHub Releases for
# every version tag. shortcut: debug-signed APK (installable now); Play Store
# / App Store publication needs a proper signing keystore via EAS later.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile dependencies
        run: npm install

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/OpenRegistro.apk
          ls -lh dist/OpenRegistro.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRegistro-apk
          path: apps/mobile/dist/OpenRegistro.apk

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/OpenRegistro.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
