name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: '10.29.3'
  NODE_VERSION: '22'

jobs:
  lint-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          AUTH_SECRET: ci-build-placeholder-not-used-at-runtime

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openregistro
          POSTGRES_PASSWORD: openregistro
          POSTGRES_DB: openregistro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openregistro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openregistro:openregistro@localhost:5432/openregistro
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Postgres migrations
        run: pnpm --filter @openregistro/db db:migrate

      - name: Unit and integration tests (both storage drivers)
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    # The sandboxed environment these specs were originally written in hit
    # Chromium crashes when a second browser page/context opened mid-run (see
    # CLAUDE.md Phase 5c notes) - the suite was restructured around that and
    # now passes reliably there, but a GitHub-hosted runner is a different
    # environment this has not yet been verified against. Non-blocking until
    # a green run here confirms it.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @openregistro/web exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
